		#RealChute_Part_Cone_Title = RealChute 锥形降落伞
		#RealChute_Part_Cone_Description = 当年鲍勃乘坐的返回舱正在坠落，那顶“一键展开、通用尺寸”的降落伞却整个被扯飞，他差点糊在舱壁上，于是要求改变。KSC 以成本为由置之不理，直到他带着一枚 BACC 固体助推器、一个打火机和一瓶喝空的威士忌回来。吓坏了的 KSC 工程师们就此发明了 Real Chute——一顶高度可调、逐步展开的降落伞。
		#RealChute_Part_ConeDouble_Title = RealChute 锥形双伞
		#RealChute_Part_ConeDouble_Description = 比尔的 Real Chute 没能止住返回舱的尖啸下坠，他差点葬身火海，于是要求改变。KSC 以成本为由置之不理，直到某天下午他把几枚从杰巴迪亚废料场捡来的备用助推器绑在车上，一路嚎叫着连人带那薄如纸片的隔热盾撞进董事会会议室，把早已受惊过度的董事们吓得魂飞魄散。KSC 工程师们赶紧在这款本已成功的 Real Chute 上加装了一顶减速伞。
		#RealChute_Part_Stack_Title = RealChute 堆叠降落伞
		#RealChute_Part_Stack_Description = 当弗恩赫设计出一顶可以挂在部件下方的降落伞时，眼含热泪的行政人员们直接叫来了养老院。而当弗恩赫用 KSC 草坪上一片冒烟的弹坑拼出“把我送进去试试！”时，他们立刻让他的设想成了真。
		#RealChute_Part_Radial_Title = RealChute 径向降落伞
		#RealChute_Part_Radial_Description = 杰巴迪亚为他的新重型返回舱只配一顶降落伞而欢呼雀跃，KSC 工程师们预见到即将到来的惨剧，立刻发明了 Real Chute 的径向版本。
		#RealChute_Agent_RealChute_Title = RealChute
		#RealChute_Agent_RealChute_Description = RealChute 是温克尔公司的一个部门，源自一项“产业—政府—学界”联合研究项目。该项目与坎巴拉航天局（KSA）及坎宾大学合作开展，旨在研发更完善的航天器回收系统。
		#RealChute_Agent_Wenkel_Title = 温克尔公司
		#RealChute_Agent_Wenkel_Description = 公司由温克尔·坎曼于坎历 450 年创立，最初是为了把他的蒸汽压缩式制冷机组推向家用市场；如今公司为航空航天工业研发并制造空调与热控系统。近来，它通过子公司“RealChute 气动减速回收系统”推出的创新产品，打入了航天器回收系统市场。

