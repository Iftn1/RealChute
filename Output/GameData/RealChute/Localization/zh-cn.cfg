// ===========================================================================
// RealChute - Localization / 本地化文件
// Path: GameData/RealChute/Localization/zh-cn.cfg
//
// Key namespace : #RealChute_*  (isolated from stock #autoLOC_* and other mods)
// Encoding      : UTF-8 without BOM（含中文，切勿用 GBK/ANSI 另存）
// Placeholders  : <<1>>, <<2>> ... are replaced at runtime, in order, by the
//                 values given to RealChute.Localization.Get(tag, values)
//                 (KSP Localizer.Format syntax, same as the stock dictionary)
// Newlines      : inside a value, write \n (the KSP config parser restores it)
//
// en-us : English        zh-cn : Simplified Chinese（本文件）
// Key names are frozen: translate the values only, never the keys.
// ===========================================================================

