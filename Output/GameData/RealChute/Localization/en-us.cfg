// en-us : English        zh-cn : Simplified Chinese (see zh-cn.cfg)
// Keys used in .cfg files (PART/AGENT/MATERIAL) are resolved by the stock
// Localizer and must also keep the leading # in the config itself.
// ===========================================================================

