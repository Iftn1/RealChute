		#RealChute_Part_Cone_Title = RealChute Cone Chute
		#RealChute_Part_Cone_Description = After Bob almost splattered against the walls of a descending capsule whose instantly-deploying, one-size fits all parachute ripped off, he demanded change. KSC ignored his demand, citing cost, until he returned with a BACC, a lighter, and an empty bottle of Scotch. Terrified, KSC engineers invented the Real Chute, which is highly configurable gradually deploys.
		#RealChute_Part_ConeDouble_Title = RealChute Cone Double Chute
		#RealChute_Part_ConeDouble_Description = After Bill nearly met fiery doom because his Real Chute could not stop his capsule's screaming descent, he demanded change. KSC ignored his demand, citing cost, until he strapped some spare boosters from Jebediah's Junkyard onto his car and flew into the boardroom one afternoon, terrorizing the already traumatized directors with savage screams and his wafer-thin heatshield. KSC engineers hastily added a drogue chute to their otherwise successful Real Chute design.
		#RealChute_Part_Stack_Title = RealChute Stack Chute
		#RealChute_Part_Stack_Description = When Vernher designed a parachute that could be placed under things, administrators with brimming eyes called the nursing home. When Verhner spelled "Institutionalize THIS!" with smoking craters on KSC's lawn, they immediately effected his vision.
		#RealChute_Part_Radial_Title = RealChute Radial Chute
		#RealChute_Part_Radial_Description = After Jebediah rejoiced his new heavy capsule's having only one parachute, KSC engineers foresaw the impending fiasco and immediately invented a radial version of the Real Chute.
		#RealChute_Agent_RealChute_Title = RealChute
		#RealChute_Agent_RealChute_Description = A division of Wenkel Corporation, RealChutes was the result of an Industry-Government-Academia Joint Research project undertaken in conjunction with the Kerbal Space Administration (KSA) and the University of Kerbin to develop improved spacecraft recovery systems.
		#RealChute_Agent_Wenkel_Title = Wenkel Corporation
		#RealChute_Agent_Wenkel_Description = Originally founded by Wenkel Kerman in KY 450 to commercialize his vapor-compression refrigeration units for domestic use, the company now develops and manufactures air conditioning and thermal control systems for the aerospace industry. More recently, it has entered the spacecraft recovery systems market through innovative new products by its subsidiary, RealChute Aerodynamic Deacceleration Recovery Systems.

